<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videollamada - Music Hub</title>
    <link rel="stylesheet" href="Videollamada.css?v=2">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            MUSIC HUB
        </div>
        <a href="Home.html"
           class="back-link">
            Regresar
        </a>
    </header>

    <div class="call-app">
        <main class="call-stage">
            <div class="call-status-bar">
                <span class="live-dot"
                      id="liveDot">
                </span>
                <span id="callStatus">
                    Conectando...
                </span>
            </div>

            <section class="remote-video">
                <video id="remoteVideo"
                       autoplay
                       playsinline></video>

                <div class="remote-placeholder"
                     id="remotePlaceholder">
                    Esperando el video de la otra persona...
                </div>

                <div class="remote-name">
                    <h2 id="remoteName">
                        Usuario
                    </h2>
                    <span id="remoteState">
                        Llamando...
                    </span>
                </div>
            </section>

            <div class="self-video">
                <video id="selfVideo"
                       autoplay
                       playsinline
                       muted></video>
                <span>
                    Tú
                </span>
            </div>

            <div class="call-controls">
                <button type="button"
                        class="control"
                        id="toggleMic"
                        title="Micrófono">
                    <svg viewBox="0 0 24 24"
                         aria-hidden="true">
                        <path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z" fill="currentColor" />
                        <path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span class="control-label">
                        Micrófono
                    </span>
                </button>

                <button type="button"
                        class="control"
                        id="toggleCamera"
                        title="Cámara">
                    <svg viewBox="0 0 24 24"
                         aria-hidden="true">
                        <path d="M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="currentColor" />
                        <path d="M16 10l5-3v10l-5-3z" fill="currentColor" />
                    </svg>
                    <span class="control-label">
                        Cámara
                    </span>
                </button>

                <button type="button"
                        class="control end"
                        id="endCall"
                        title="Colgar">
                    <svg viewBox="0 0 24 24"
                         aria-hidden="true">
                        <path d="M4 14c5-3 11-3 16 0v2a2 2 0 0 1-2 2h-2l-1-3a9 9 0 0 0-6 0l-1 3H4a2 2 0 0 1-2-2z" fill="currentColor" />
                    </svg>
                    <span class="control-label">
                        Colgar
                    </span>
                </button>
            </div>
        </main>
    </div>

    <div class="call-ended"
         id="callEnded"
         hidden>
        <p id="callEndedText">
            La llamada terminó.
        </p>
        <a href="Home.html"
           class="back-link">
            Volver al chat
        </a>
    </div>

    <script src="libs/signalr.min.js?v=7"></script>
    <script src="Videollamada.js?v=2"></script>
</body>

</html>
